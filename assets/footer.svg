<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img"><title>Stefan Penchev — software and engineering</title><defs><linearGradient id="g"><stop stop-color="#54d9ed"/><stop offset="1" stop-color="#a5adff"/></linearGradient><radialGradient id="glow"><stop stop-color="#23476b"/><stop offset="1" stop-color="#0d1729"/></radialGradient></defs><style>text{font-family:Verdana,sans-serif} .pulse{animation:p 7s ease-in-out infinite} @keyframes p{50%{opacity:.35}} @media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><rect width="1200" height="150" rx="18" fill="#0d1729"/><path d="M0 1h1200" stroke="url(#g)" stroke-width="2"/><g fill="none" stroke="#253c54"><path d="m0 115 120-40 120 40 120-40 120 40m240 0 120-40 120 40 120-40 120 40"/></g><text x="600" y="66" text-anchor="middle" font-size="25" fill="#eef4ff">Always curious. Always building.</text><text x="600" y="102" text-anchor="middle" font-size="15" fill="#a5adff">From the first idea to the details that make it work.</text><circle cx="600" cy="127" r="3" fill="#54d9ed" class="pulse"/></svg>