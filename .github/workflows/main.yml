name: Refresh profile visuals
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-stats.py
      - .github/workflows/main.yml
permissions:
  contents: read
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'StefanPenchev05/StefanPenchev05'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Generate statistics from GitHub data
        run: python3 scripts/generate-stats.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save refreshed statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/languages.svg assets/activity.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile statistics'
            git push origin HEAD:main
          fi
      - name: Generate theme-aware snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#276b83&color_dots=#ebf2f8,#b7e5ed,#79cedd,#3aa3ba,#276b83
            dist/github-contribution-grid-snake-dark.svg?color_snake=#79deed&color_dots=#17263d,#1e5368,#297f94,#40b2c4,#79deed
      - name: Publish snake assets
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Refresh contribution snakes
        env:
          GITHUB_TOKEN: ${{ github.token }}
